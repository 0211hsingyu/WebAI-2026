<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            margin: 100px;
            border-radius: 50%;
            overflow: hidden;
        }
        img{
            width: 200px;
            height: 200px;
            object-fit: cover;
            transition: all .3s;    
        }
        div:hover img{
            
            transform: scale(1.5);
        }
    </style>
</head>
<body>
    <div>
    <img src="/images/03.jpg" alt="">
    </div>
</body>
</html>
